version: '3.8'

volumes:
  pg01db:
    driver: local
  pg02db:
    driver: local
  pg03db:
    driver: local
  pg01arc:
    driver: local
  pg02arc:
    driver: local
  pg03arc:
    driver: local

networks:
  pgcluster_network:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
    labels:
      - "com.wallacearizona.network=pgcluster"

services:
  pg01:
    image: registry.local.wallacearizona.us/pg:1.0.1
    hostname: pg01
    environment:
      INITIAL_NODE_TYPE: master
      NODE_ID: 1
      NODE_NAME: pg01
      MSLIST: "myservice"
      MSOWNERPWDLIST: "myservice_owner"
      MSUSERPWDLIST: "myservice_user"
      REPMGRPWD: rep123
      REPMGRD_FAILOVER_MODE: manual
      PGMASTER: pg01
    ports:
      - target: 5432
        published: 15432
        mode: host
    volumes:
      - pg01db:/data
      - pg01arc:/archive
    networks:
      - pgcluster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U repmgr -d repmgr -tAc 'SELECT COUNT(*) FROM repmgr.nodes' | grep -q '[0-9]' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres.node == pg01
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      labels:
        - "com.wallacearizona.service=postgres-master"
        - "com.wallacearizona.cluster=pgcluster"

  pg02:
    image: registry.local.wallacearizona.us/pg:1.0.1
    hostname: pg02
    environment:
      INITIAL_NODE_TYPE: slave
      NODE_ID: 2
      NODE_NAME: pg02
      MSLIST: "myservice"
      MSOWNERPWDLIST: "myservice_owner"
      MSUSERPWDLIST: "myservice_user"
      REPMGRPWD: rep123
      REPMGRD_FAILOVER_MODE: manual
      PGMASTER: pg01
    ports:
      - target: 5432
        published: 25432
        mode: host
    volumes:
      - pg02db:/data
      - pg02arc:/archive
    networks:
      - pgcluster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres.node == pg02
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      labels:
        - "com.wallacearizona.service=postgres-slave"
        - "com.wallacearizona.cluster=pgcluster"

  pg03:
    image: registry.local.wallacearizona.us/pg:1.0.1
    hostname: pg03
    environment:
      INITIAL_NODE_TYPE: slave
      NODE_ID: 3
      NODE_NAME: pg03
      MSLIST: "myservice"
      MSOWNERPWDLIST: "myservice_owner"
      MSUSERPWDLIST: "myservice_user"
      REPMGRPWD: rep123
      REPMGRD_FAILOVER_MODE: manual
      PGMASTER: pg01
    ports:
      - target: 5432
        published: 35432
        mode: host
    volumes:
      - pg03db:/data
      - pg03arc:/archive
    networks:
      - pgcluster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres.node == pg03
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      labels:
        - "com.wallacearizona.service=postgres-slave"
        - "com.wallacearizona.cluster=pgcluster"

  pgpool:
    image: registry.local.wallacearizona.us/pgpool:1.0.1
    hostname: pgpool
    ports:
      - target: 9999
        published: 9999
        mode: ingress
    environment:
      PGMASTER_NODE_NAME: pg01
      PG_BACKEND_NODE_LIST: 0:pg01:5432:1:/data:ALLOW_TO_FAILOVER,1:pg02:5432:1:/data:ALLOW_TO_FAILOVER,2:pg03:5432:1:/data:ALLOW_TO_FAILOVER
      PGP_NODE_NAME: pgpool
      REPMGRPWD: rep123
      FAILOVER_MODE: automatic
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: 3
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: 1
      PGPOOL_FAIL_OVER_ON_BACKEND_ERROR: "off"
      PGPOOL_HEALTH_CHECK_PERIOD: 5
      PGPOOL_NUM_INIT_CHILDREN: 50
      PGPOOL_LOAD_BALANCE_MODE: "no"
      PGPOOL_LOG_CONNECTIONS: "off"
    networks:
      - pgcluster_network
    depends_on:
      pg01:
        condition: service_started
      pg02:
        condition: service_started
      pg03:
        condition: service_started
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      labels:
        - "com.wallacearizona.service=pgpool"
        - "com.wallacearizona.cluster=pgcluster"

  manager:
    image: registry.local.wallacearizona.us/manager:1.0.1
    hostname: manager
    ports:
      - target: 8080
        published: 8080
        mode: ingress
    environment:
      PG_BACKEND_NODE_LIST: 0:pg01:5432:1:/data:ALLOW_TO_FAILOVER,1:pg02:5432:1:/data:ALLOW_TO_FAILOVER,2:pg03:5432:1:/data:ALLOW_TO_FAILOVER
      REPMGRPWD: rep123
      DBHOST: pgpool
    networks:
      - pgcluster_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - pgpool
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "com.wallacearizona.service=manager"
        - "com.wallacearizona.cluster=pgcluster"

