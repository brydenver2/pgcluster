version: '3.8'

volumes:
  pg01db:
    driver: local
  pg02db:
    driver: local
  pg03db:
    driver: local
  pg01arc:
    driver: local
  pg02arc:
    driver: local
  pg03arc:
    driver: local

secrets:
  postgres_password:
    external: true
  repmgr_password:
    external: true

networks:
  pgcluster_network:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
    labels:
      - "com.wallacearizona.network=pgcluster"
  traefik_proxy:
    external: true

services:
  pg01:
    image: registry.local.wallacearizona.us/pg:1.0.1
    hostname: pg01
    secrets:
      - postgres_password
      - repmgr_password
    environment:
      INITIAL_NODE_TYPE: master
      NODE_ID: 1
      NODE_NAME: pg01
      MSLIST: "myservice"
      MSOWNERPWDLIST: "myservice_owner"
      MSUSERPWDLIST: "myservice_user"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REPMGRPWD_FILE: /run/secrets/repmgr_password
      REPMGRD_FAILOVER_MODE: manual
      PGMASTER: pg01
    ports:
      - target: 5432
        published: 15432
        mode: host
    volumes:
      - pg01db:/data
      - pg01arc:/archive
    networks:
      - pgcluster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U repmgr -d repmgr -tAc 'SELECT COUNT(*) FROM repmgr.nodes' | grep -q '[0-9]' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres.node == pg01
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      labels:
        - "com.wallacearizona.service=postgres-master"
        - "com.wallacearizona.cluster=pgcluster"

  pg02:
    image: registry.local.wallacearizona.us/pg:1.0.1
    hostname: pg02
    secrets:
      - postgres_password
      - repmgr_password
    environment:
      INITIAL_NODE_TYPE: slave
      NODE_ID: 2
      NODE_NAME: pg02
      MSLIST: "myservice"
      MSOWNERPWDLIST: "myservice_owner"
      MSUSERPWDLIST: "myservice_user"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REPMGRPWD_FILE: /run/secrets/repmgr_password
      REPMGRD_FAILOVER_MODE: manual
      PGMASTER: pg01
    ports:
      - target: 5432
        published: 25432
        mode: host
    volumes:
      - pg02db:/data
      - pg02arc:/archive
    networks:
      - pgcluster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres.node == pg02
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      labels:
        - "com.wallacearizona.service=postgres-slave"
        - "com.wallacearizona.cluster=pgcluster"

  pg03:
    image: registry.local.wallacearizona.us/pg:1.0.1
    hostname: pg03
    secrets:
      - postgres_password
      - repmgr_password
    environment:
      INITIAL_NODE_TYPE: slave
      NODE_ID: 3
      NODE_NAME: pg03
      MSLIST: "myservice"
      MSOWNERPWDLIST: "myservice_owner"
      MSUSERPWDLIST: "myservice_user"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REPMGRPWD_FILE: /run/secrets/repmgr_password
      REPMGRD_FAILOVER_MODE: manual
      PGMASTER: pg01
    ports:
      - target: 5432
        published: 35432
        mode: host
    volumes:
      - pg03db:/data
      - pg03arc:/archive
    networks:
      - pgcluster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres.node == pg03
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      labels:
        - "com.wallacearizona.service=postgres-slave"
        - "com.wallacearizona.cluster=pgcluster"

  pgpool:
    image: registry.local.wallacearizona.us/pgpool:1.0.1
    hostname: pgpool
    secrets:
      - postgres_password
      - repmgr_password
    environment:
      PGMASTER_NODE_NAME: pg01
      PG_BACKEND_NODE_LIST: 0:pg01:5432:1:/data:ALLOW_TO_FAILOVER,1:pg02:5432:1:/data:ALLOW_TO_FAILOVER,2:pg03:5432:1:/data:ALLOW_TO_FAILOVER
      PGP_NODE_NAME: pgpool
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REPMGRPWD_FILE: /run/secrets/repmgr_password
      FAILOVER_MODE: automatic
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: 3
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: 1
      PGPOOL_FAILOVER_ON_BACKEND_ERROR: "off"
      PGPOOL_HEALTH_CHECK_PERIOD: 5
      PGPOOL_NUM_INIT_CHILDREN: 50
      PGPOOL_LOAD_BALANCE_MODE: "no"
      PGPOOL_LOG_CONNECTIONS: "off"
      # Optional: Enable automatic pool_passwd refresh via cron
      # Format: "minute hour day month dayofweek"
      # Examples:
      #   "*/30 * * * *"     - Every 30 minutes
      #   "0 */2 * * *"      - Every 2 hours
      #   "0 0 * * *"        - Daily at midnight
      # POOL_PASSWD_REFRESH_CRON: "0 */6 * * *"  # Every 6 hours
    networks:
      - pgcluster_network
      - traefik_proxy
    depends_on:
      - pg01
      - pg02
      - pg03
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      labels:
        - "com.wallacearizona.service=pgpool"
        - "com.wallacearizona.cluster=pgcluster"
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_proxy"
        - "traefik.tcp.routers.pgpool.entrypoints=postgres"
        - "traefik.tcp.routers.pgpool.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.pgpool.tls.passthrough=true"
        - "traefik.tcp.services.pgpool.loadbalancer.server.port=9999"

  manager:
    image: registry.local.wallacearizona.us/manager:1.0.1
    hostname: manager
    secrets:
      - repmgr_password
    environment:
      PG_BACKEND_NODE_LIST: 0:pg01:5432:1:/data:ALLOW_TO_FAILOVER,1:pg02:5432:1:/data:ALLOW_TO_FAILOVER,2:pg03:5432:1:/data:ALLOW_TO_FAILOVER
      REPMGRPWD_FILE: /run/secrets/repmgr_password
      DBHOST: pgpool
    networks:
      - pgcluster_network
      - traefik_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - pgpool
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "com.wallacearizona.service=manager"
        - "com.wallacearizona.cluster=pgcluster"
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_proxy"
        - "traefik.http.routers.pgmanager.entrypoints=websecure"
        - "traefik.http.routers.pgmanager.rule=Host(`pgclstr.local.wallacearizona.us`) && PathPrefix(`/manager`)"
        - "traefik.http.routers.pgmanager.tls=true"
        - "traefik.http.routers.pgmanager.tls.certresolver=production"
        - "traefik.http.routers.pgmanager.middlewares=pgmanager-stripprefix"
        - "traefik.http.middlewares.pgmanager-stripprefix.stripprefix.prefixes=/manager"
        - "traefik.http.services.pgmanager.loadbalancer.server.port=8080"

